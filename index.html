<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Shop Assistant</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <!-- HEADER -->

        <div class="header">

            <h1>
                AI Shop Assistant
            </h1>

            <button class="admin-button" onclick="openAdmin()">
                ⚙ Admin
            </button>

        </div>


        <p class="subtitle">

            Ask me about electronics or furniture products

        </p>


        <!-- CHAT -->

        <div id="chatBox" class="chat-box">

            <div class="bot message">

                Hello! 👋

                <br><br>

                Ask me about:

                <br>
                📱 Phones

                <br>
                💻 Laptops

                <br>
                📺 TVs

                <br>
                🎧 Headphones

                <br>
                🛋️ Sofas

                <br>
                🪑 Chairs

                <br>
                🛏️ Beds

                <br>
                🪵 Tables

            </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <input type="text" id="question" placeholder="Ask about a product..." onkeydown="handleEnter(event)">

            <button onclick="sendMessage()">

                Send

            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
